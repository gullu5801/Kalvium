<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Utility Manager - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Utility Manager - Task Manager</h1>
  </header>

  <main>
    <section id="task-form">
      <h2>Add a Task</h2>
      <form id="form">
        <input type="text" id="taskName" placeholder="Enter task name" required>
        <input type="number" id="priority" placeholder="Priority (1-5)" min="1" max="5" required>
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section id="task-list">
      <h2>Task List</h2>
      <ul id="tasks"></ul>
    </section>

    <section id="summary">
      <h2>Summary</h2>
      <p id="summaryOutput"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
