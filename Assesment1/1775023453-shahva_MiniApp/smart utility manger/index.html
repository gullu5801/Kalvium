<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Expense Tracker</h1>
    <p>Track and manage your expenses easily</p>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Form Section -->
    <section>
      <form id="expense-form">
        <input 
          type="text" 
          id="name" 
          placeholder="Enter expense name" 
          required 
        />

        <input 
          type="number" 
          id="amount" 
          placeholder="Enter amount" 
          min="0"
          required 
        />

        <button type="submit">Add Expense</button>
      </form>
    </section>

    <!-- Total Section -->
    <section>
      <h2>Total: $<span id="total">0</span></h2>

      <div style="margin-top:10px;">
        <button type="button" onclick="resetExpenses()">Reset All</button>
      </div>
    </section>

    <!-- List Section -->
    <section>
      <ul id="list"></ul>
    </section>

    <!-- Empty State -->
    <section>
      <p id="empty-message">No expenses added yet.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
