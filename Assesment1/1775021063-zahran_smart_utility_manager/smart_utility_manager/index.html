<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Utility Manager</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Smart Utility Manager - Expense Tracker</h1>

<form id="expenseForm">
<input type="text" id="title" placeholder="Expense Name" required>
<input type="number" id="amount" placeholder="Amount" required>
<select id="category">
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Shopping">Shopping</option>
<option value="Other">Other</option>
</select>

<button type="submit">Add Expense</button>
</form>

<div class="filters">
<button id="all">All</button>
<button id="food">Food</button>
<button id="transport">Transport</button>
<button id="shopping">Shopping</button>
</div>

<ul id="expenseList"></ul>

<div class="summary">
<h3>Total: $<span id="total">0</span></h3>
<h3>Count: <span id="count">0</span></h3>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
